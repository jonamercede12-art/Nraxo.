name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project structure
        shell: bash
        run: |
          set -euxo pipefail
          echo "Directorio actual:"
          pwd
          echo "Contenido:"
          ls -la
          echo "Archivos del proyecto:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No se encontró package.json."
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f package.json ]; then
            echo "No se encontró package.json."
            exit 1
          fi

          echo "Scripts disponibles:"
          node -e "console.log(require('./package.json').scripts || {})"

          if npm run | grep -qE '^  build$'; then
            npm run build
          else
            echo "El proyecto no tiene un script 'build' en package.json."
            exit 1
          fi
