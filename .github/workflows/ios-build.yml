name: iOS Build

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-15

steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Setup Xcode
    uses: maxim-lobanov/setup-xcode@v1
    with:
      xcode-version: "16.4"
  - name: Verify project
    run: |
      set -e
      PROJECT="$GITHUB_WORKSPACE/3105-main/ThreeOneOSFive/ThreeOneOSFive.xcodeproj"
      if [ ! -d "$PROJECT" ]; then
        echo "ERROR: Project not found:"
        echo "$PROJECT"
        echo ""
        find "$GITHUB_WORKSPACE" -maxdepth 6 -name "*.xcodeproj" -print
        exit 1
      fi
      echo "Project found:"
      echo "$PROJECT"
  - name: Prepare resources
    run: |
      find "$GITHUB_WORKSPACE/3105-main/ThreeOneOSFive/SeedPatches" \
        -type f -name "*.3105" -exec chmod 644 {} \;
  - name: Build
    working-directory: 3105-main/ThreeOneOSFive
    run: |
      set -e
      xcodebuild \
        -project ThreeOneOSFive.xcodeproj \
        -scheme 3105 \
        -configuration Release \
        -sdk iphoneos \
        -derivedDataPath "$GITHUB_WORKSPACE/build" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY=""
  - name: Create IPA
    run: |
      set -e
      APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/3105.app"
      if [ ! -d "$APP" ]; then
        echo "ERROR: 3105.app was not created."
        find "$GITHUB_WORKSPACE/build" -name "*.app" -print
        exit 1
      fi
      rm -rf "$GITHUB_WORKSPACE/Payload"
      mkdir -p "$GITHUB_WORKSPACE/Payload"
      cp -R "$APP" "$GITHUB_WORKSPACE/Payload/3105.app"
      cd "$GITHUB_WORKSPACE"
      zip -qry 3105.ipa Payload
  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: 3105-IPA
      path: 3105.ipa
      if-no-files-found: error
