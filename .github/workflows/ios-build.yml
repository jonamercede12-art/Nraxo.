name: Build 3105 IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 3105 IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -e

          ZIP_FILE="3105-with-github-actions.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró $ZIP_FILE"
            echo ""
            echo "Archivos disponibles:"
            ls -lah
            exit 1
          fi

          echo "Descomprimiendo $ZIP_FILE..."

          unzip -o "$ZIP_FILE" -d .

          echo ""
          echo "Contenido extraído:"
          ls -lah

      - name: Verify Xcode project
        run: |
          set -e

          PROJECT="3105-main/ThreeOneOSFive.xcodeproj/project.pbxproj"

          if [ ! -f "$PROJECT" ]; then
            echo "ERROR: No se encontró:"
            echo "$PROJECT"
            echo ""
            echo "Proyectos Xcode encontrados:"
            find . -name "*.xcodeproj" -type d -print
            exit 1
          fi

          echo "Proyecto encontrado correctamente:"
          echo "$PROJECT"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Show project targets
        working-directory: 3105-main
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -list

      - name: Build iOS app
        working-directory: 3105-main
        run: |
          set -e

          rm -rf build

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find built app
        working-directory: 3105-main
        run: |
          set -e

          APP_PATH=$(find build/Build/Products \
            -type d \
            -name "3105.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró 3105.app"
            echo ""
            echo "Contenido de Build/Products:"
            find build/Build/Products -maxdepth 4 -print || true
            exit 1
          fi

          echo "App encontrada:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create IPA
        working-directory: 3105-main
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/3105.app

          rm -f 3105.ipa

          zip -qry 3105.ipa Payload

          echo ""
          echo "================================"
          echo "IPA CREADA CORRECTAMENTE"
          echo "================================"
          ls -lh 3105.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105-main/3105.ipa
          if-no-files-found: error
