name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q "$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)" -d project

      - name: Find project
        run: |
          set -e
          PROJECT=$(find "$GITHUB_WORKSPACE/project" -type d -name "*.xcodeproj" -print -quit)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -e

          xcodebuild \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Convert APP to IPA
        run: |
          set -e

          APP=$(find "$GITHUB_WORKSPACE/build/Build/Products" -type d -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "No se encontró el archivo .app"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -qry "$GITHUB_WORKSPACE/3105.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: 3105.ipa
