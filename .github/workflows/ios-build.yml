name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer ZIP
        run: |
          set -e

          unzip -q "3105-with-github-actions.zip" -d extracted

          echo "Contenido:"
          find extracted -maxdepth 3 -type d

      - name: Compilar ThreeOneOSFive
        run: |
          set -e

          cd extracted/3105-main

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crear IPA
        run: |
          set -e

          APP=$(find extracted/3105-main/build/Build/Products -type d -name "*.app" | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró el archivo .app"
            exit 1
          fi

          echo "APP encontrada:"
          echo "$APP"

          rm -rf Payload ThreeOneOSFive.ipa

          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry ThreeOneOSFive.ipa Payload

          ls -lh ThreeOneOSFive.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: ThreeOneOSFive.ipa
