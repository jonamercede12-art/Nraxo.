name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer ZIP
        run: |
          set -e

          unzip -q "3105-with-github-actions.zip" -d extracted

          echo "Contenido:"
          find extracted -maxdepth 3 -type d

      - name: Verificar archivos del proyecto
        run: |
          set -e

          echo "Buscando App.swift..."
          find extracted -name "App.swift" -print

          echo ""
          echo "Buscando PatchProjectLibrary.swift..."
          find extracted -name "PatchProjectLibrary.swift" -print

      - name: Corregir App.swift
        run: |
          set -e

          APP_FILE="extracted/3105-main/ThreeOneOSFive/App.swift"

          if [ ! -f "$APP_FILE" ]; then
            echo "ERROR: No se encontró:"
            echo "$APP_FILE"
            exit 1
          fi

          python3 - "$APP_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          needle = "    var maskedKey: String {"

          positions = []
          pos = 0

          while True:
              found = text.find(needle, pos)

              if found == -1:
                  break

              positions.append(found)
              pos = found + len(needle)

          print("Declaraciones maskedKey encontradas:", len(positions))

          if len(positions) <= 1:
              print("No hay duplicado que eliminar.")
              raise SystemExit(0)

          start = positions[1]

          brace = text.find("{", start)

          if brace == -1:
              raise SystemExit(
                  "No se encontró la llave de maskedKey."
              )

          depth = 0
          i = brace

          while i < len(text):

              if text[i] == "{":
                  depth += 1

              elif text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1

                      while end < len(text) and text[end] in " \t":
                          end += 1

                      if end < len(text) and text[end] == "\n":
                          end += 1

                      text = text[:start] + text[end:]

                      path.write_text(
                          text,
                          encoding="utf-8"
                      )

                      print(
                          "Duplicado maskedKey eliminado correctamente."
                      )

                      print(
                          "Declaraciones restantes:",
                          text.count(needle)
                      )

                      raise SystemExit(0)

              i += 1

          raise SystemExit(
              "No se pudo encontrar el final de la segunda "
              "propiedad maskedKey."
          )
          PY

          echo ""
          echo "Verificación:"
          grep -n "var maskedKey: String" "$APP_FILE" || true

      - name: Corregir PatchProjectLibrary.swift
        run: |
          set -e

          PATCH_FILE="extracted/3105-main/ThreeOneOSFive/helpers/PatchProjectLibrary.swift"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "PatchProjectLibrary.swift no encontrado en la ruta esperada."
            echo "Buscando archivo..."
            PATCH_FILE=$(find extracted -name "PatchProjectLibrary.swift" -type f | head -1)
          fi

          if [ -z "$PATCH_FILE" ] || [ ! -f "$PATCH_FILE" ]; then
            echo "No se encontró PatchProjectLibrary.swift."
            exit 1
          fi

          echo "Archivo encontrado:"
          echo "$PATCH_FILE"

          python3 - "$PATCH_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          text = path.read_text(encoding="utf-8")

          old = "! $0.lastPathComponent.uppercased()"
          new = "!$0.lastPathComponent.uppercased()"

          occurrences = text.count(old)

          print(
              "Operadores con espacio encontrados:",
              occurrences
          )

          if occurrences > 0:
              text = text.replace(old, new)

              path.write_text(
                  text,
                  encoding="utf-8"
              )

              print(
                  "Corrección aplicada correctamente."
              )
          else:
              print(
                  "No fue necesario modificar el operador."
              )
          PY

          echo ""
          echo "Verificación PatchProjectLibrary.swift:"
          grep -n "lastPathComponent.uppercased" "$PATCH_FILE" || true

      - name: Comprobar estructura
        run: |
          set -e

          PROJECT_DIR="extracted/3105-main"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: No existe:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/ThreeOneOSFive.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: No se encontró el proyecto Xcode."
            exit 1
          fi

          echo "Proyecto encontrado correctamente."

          echo ""
          echo "Archivos Swift:"
          find "$PROJECT_DIR/ThreeOneOSFive" \
            -type f \
            -name "*.swift" \
            -print

      - name: Compilar ThreeOneOSFive
        run: |
          set -e

          cd extracted/3105-main

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crear IPA
        run: |
          set -e

          APP=$(find extracted/3105-main/build/Build/Products \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró el archivo .app"
            echo ""
            echo "Contenido de Products:"
            find extracted/3105-main/build/Build/Products \
              -maxdepth 3 \
              -print || true
            exit 1
          fi

          echo "APP encontrada:"
          echo "$APP"

          rm -rf Payload ThreeOneOSFive.ipa

          mkdir Payload

          cp -R "$APP" Payload/

          zip -qry ThreeOneOSFive.ipa Payload

          echo ""
          echo "IPA creada:"
          ls -lh ThreeOneOSFive.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: ThreeOneOSFive.ipa
