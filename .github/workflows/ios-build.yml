name: iOS Build

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-15

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Setup Xcode
    uses: maxim-lobanov/setup-xcode@v1
    with:
      xcode-version: "16.4"
  - name: Locate Xcode project
    id: project
    shell: bash
    run: |
      set -e
      PROJECT=$(find "$GITHUB_WORKSPACE" \
        -type d \
        -name "*.xcodeproj" \
        -print -quit)
      if [ -z "$PROJECT" ]; then
        echo "ERROR: No .xcodeproj found in repository."
        echo "Repository contents:"
        find "$GITHUB_WORKSPACE" -maxdepth 5 -print
        exit 1
      fi
      echo "Found: $PROJECT"
      echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
  - name: Prepare patch files
    run: |
      find "$GITHUB_WORKSPACE" \
        -type f \
        -name "*.3105" \
        -exec chmod 644 {} \;
  - name: Build
    shell: bash
    run: |
      set -e
      PROJECT="${{ steps.project.outputs.path }}"
      PROJECT_DIR="$(dirname "$PROJECT")"
      PROJECT_NAME="$(basename "$PROJECT")"
      cd "$PROJECT_DIR"
      xcodebuild \
        -project "$PROJECT_NAME" \
        -scheme 3105 \
        -configuration Release \
        -sdk iphoneos \
        -derivedDataPath "$GITHUB_WORKSPACE/build" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY=""
  - name: Create IPA
    shell: bash
    run: |
      set -e
      APP=$(find "$GITHUB_WORKSPACE/build/Build/Products" \
        -type d \
        -name "*.app" \
        -print -quit)
      if [ -z "$APP" ]; then
        echo "ERROR: Build completed without producing an .app"
        exit 1
      fi
      rm -rf "$GITHUB_WORKSPACE/Payload"
      mkdir -p "$GITHUB_WORKSPACE/Payload"
      cp -R "$APP" "$GITHUB_WORKSPACE/Payload/3105.app"
      cd "$GITHUB_WORKSPACE"
      zip -qry 3105.ipa Payload
  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: 3105-IPA
      path: 3105.ipa
      if-no-files-found: error
