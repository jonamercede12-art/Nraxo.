name: Build iOS IPA

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: macos-15

steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Select Xcode
    uses: maxim-lobanov/setup-xcode@v1
    with:
      xcode-version: "16.4"
  - name: Make seed patches readable
    run: |
      find ThreeOneOSFive/SeedPatches -type f -exec chmod 644 {} \;
      find ThreeOneOSFive/SeedPatches -type d -exec chmod 755 {} \;
  - name: Clean build
    run: |
      xcodebuild clean \
        -project ThreeOneOSFive/ThreeOneOSFive.xcodeproj \
        -scheme 3105 \
        -configuration Release \
        -sdk iphoneos \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO
  - name: Build
    run: |
      xcodebuild build \
        -project ThreeOneOSFive/ThreeOneOSFive.xcodeproj \
        -scheme 3105 \
        -configuration Release \
        -sdk iphoneos \
        -derivedDataPath build \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY=""
  - name: Package IPA
    run: |
      mkdir -p Payload
      cp -R build/Build/Products/Release-iphoneos/3105.app Payload/
      zip -r 3105.ipa Payload
  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: 3105-IPA
      path: 3105.ipa
