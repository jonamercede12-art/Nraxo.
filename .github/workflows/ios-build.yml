name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e

          # Si el proyecto viene dentro del ZIP, lo descomprimimos
          if [ -f "3105-with-github-actions.zip" ]; then
            echo "ZIP encontrado. Descomprimiendo..."
            mkdir -p "$RUNNER_TEMP/3105-source"
            unzip -q "3105-with-github-actions.zip" -d "$RUNNER_TEMP/3105-source"
            SEARCH_ROOT="$RUNNER_TEMP/3105-source"
          else
            echo "No hay ZIP. Buscando proyecto directamente..."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          echo "Buscando ThreeOneOSFive.xcodeproj..."

          PROJECT=$(find "$SEARCH_ROOT" \
            -name "ThreeOneOSFive.xcodeproj" \
            -type d \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ThreeOneOSFive.xcodeproj"
            find "$SEARCH_ROOT" -maxdepth 4 -type d -name "*.xcodeproj" -print
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT"

          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Check scheme
        run: |
          set -e

          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

      - name: Build 3105
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/3105-build"
          mkdir -p "$RUNNER_TEMP/3105-build"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "3105" \
            -configuration "Release" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/3105-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find application
        shell: bash
        run: |
          set -e

          APP=$(find "$RUNNER_TEMP/3105-build" \
            -maxdepth 2 \
            -name "*.app" \
            -type d \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró el .app"
            find "$RUNNER_TEMP/3105-build" -maxdepth 3 -print
            exit 1
          fi

          echo "APP encontrado:"
          echo "$APP"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          zip -r "3105.ipa" Payload

          echo "IPA creado:"
          ls -lh "$RUNNER_TEMP/3105.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: ${{ runner.temp }}/3105.ipa
          if-no-files-found: error
