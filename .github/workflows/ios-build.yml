name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p project
          unzip -o 3105-with-github-actions.zip -d project

      - name: Find project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT=$(find project \
            -type d \
            -name "*.xcodeproj" \
            -not -path "*/Pods/*" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró el proyecto Xcode."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Detect scheme
        shell: bash
        run: |
          set -euxo pipefail

          SCHEME=$(xcodebuild \
            -project "$PROJECT" \
            -list |
            awk '/Schemes:/ {found=1; next} found && NF {print $1; exit}')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No se encontró Scheme."
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Scheme: $SCHEME"

      - name: Build unsigned app
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH=$(find build/DerivedData/Build/Products \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró el .app."
            exit 1
          fi

          echo "APP encontrado:"
          echo "$APP_PATH"

          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -r 3105.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: build/3105.ipa
