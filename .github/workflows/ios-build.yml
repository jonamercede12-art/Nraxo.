name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project build
          mkdir -p project build

          ZIP="3105-with-github-actions.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP"
            exit 1
          fi

          unzip -q "$ZIP" -d project

          echo "Proyecto extraído."

      - name: Find project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find "$GITHUB_WORKSPACE/project" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró .xcodeproj"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto:"
          echo "$PROJECT"

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail

          PATCHES="/tmp/patches.txt"
          : > "$PATCHES"

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.patch" -o -name "*.diff" \) \
            -print > "$PATCHES" || true

          if [ ! -s "$PATCHES" ]; then
            echo "No se encontraron patches."
          else
            while IFS= read -r PATCH; do
              [ -z "$PATCH" ] && continue

              echo "Procesando patch:"
              echo "$PATCH"

              cd "$PROJECT_DIR"

              if git apply --check "$PATCH" >/dev/null 2>&1; then
                git apply "$PATCH"
                echo "Patch aplicado."
              elif patch --dry-run -p1 < "$PATCH" >/dev/null 2>&1; then
                patch -p1 < "$PATCH"
                echo "Patch aplicado con patch."
              else
                echo "Patch no aplicable; se continúa."
              fi
            done < "$PATCHES"
          fi

      - name: Remove unwanted menu options
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ELIMINANDO OPCIONES NO DESEADAS"
          echo "=========================================="

          ROOT="$PROJECT_DIR"

          FILES=$(find "$ROOT" \
            -type f \
            \( \
              -name "*.swift" \
              -o -name "*.m" \
              -o -name "*.mm" \
              -o -name "*.h" \
              -o -name "*.strings" \
              -o -name "*.json" \
              -o -name "*.plist" \
            \) \
            -not -path "*/.git/*")

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            python3 - "$FILE" <<'PY'
import sys
import re

path = sys.argv[1]

try:
    with open(path, "r", encoding="utf-8") as f:
        text = f.read()
except Exception:
    sys.exit(0)

original = text

# Eliminar entradas cuyo texto/identificador sea Aimbot Pecho.
patterns = [
    r'(?im)^.*Aimbot Pecho.*$\n?',
    r'(?im)^.*AimbotPecho.*$\n?',
    r'(?im)^.*Aimbot_Pecho.*$\n?',
]

for pattern in patterns:
    text = re.sub(pattern, "", text)

# Eliminar líneas que sean claramente elementos de menú
# cuyo título/label/texto sea exactamente Body.
body_patterns = [
    r'(?im)^[ \t]*.*(?:title|label|text|name)[ \t]*[:=][ \t]*["\']Body["\'].*$\n?',
    r'(?im)^[ \t]*["\']Body["\'][ \t]*[,;]?[ \t]*$\n?',
]

for pattern in body_patterns:
    text = re.sub(pattern, "", text)

if text != original:
    try:
        with open(path, "w", encoding="utf-8") as f:
            f.write(text)
        print("Modificado:", path)
    except Exception as e:
        print("No se pudo escribir:", path, e)

PY

          done <<< "$FILES"

          echo ""
          echo "Limpieza terminada."

      - name: Verify unwanted options are gone
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFICANDO OPCIONES"
          echo "=========================================="

          FOUND=0

          if grep -RniE \
            --exclude-dir=".git" \
            --exclude-dir="DerivedData" \
            "Aimbot Pecho|AimbotPecho|Aimbot_Pecho" \
            "$PROJECT_DIR" 2>/dev/null; then

            echo ""
            echo "ERROR: Aimbot Pecho todavía existe en el código."
            FOUND=1
          fi

          if grep -RniE \
            --exclude-dir=".git" \
            --exclude-dir="DerivedData" \
            'title[[:space:]]*[:=][[:space:]]*["'\'']Body["'\'']|label[[:space:]]*[:=][[:space:]]*["'\'']Body["'\'']|text[[:space:]]*[:=][[:space:]]*["'\'']Body["'\'']' \
            "$PROJECT_DIR" 2>/dev/null; then

            echo ""
            echo "ERROR: La opción de menú Body todavía existe."
            FOUND=1
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "OK: No quedan etiquetas conocidas de esas opciones."
          else
            echo ""
            echo "Las referencias restantes no parecen ser simples etiquetas."
            echo "Continuando para permitir diagnosticar la estructura real."
          fi

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/Applications/Xcode_26.6.app/Contents/Developer" ]; then
            sudo xcode-select -s \
              "/Applications/Xcode_26.6.app/Contents/Developer"
          else
            sudo xcode-select -s \
              "/Applications/Xcode.app/Contents/Developer"
          fi

          xcodebuild -version

      - name: Detect workspace
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find "$PROJECT_DIR" \
            -maxdepth 2 \
            -type d \
            -name "*.xcworkspace" \
            | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            echo "BUILD_CONTAINER=-workspace" >> "$GITHUB_ENV"
            echo "BUILD_PATH=$WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONTAINER=-project" >> "$GITHUB_ENV"
            echo "BUILD_PATH=$PROJECT" >> "$GITHUB_ENV"
          fi

      - name: Verify Xcode project
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -list

      - name: Set scheme
        shell: bash
        run: |
          set -euo pipefail

          echo "SCHEME=3105" >> "$GITHUB_ENV"

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build/DerivedData"

          mkdir -p "$GITHUB_WORKSPACE/build/DerivedData"

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          echo "Compilando 3105..."

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name "*.app" \
            -path "*/Build/Products/Release-iphoneos/*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró la aplicación compilada."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "APP:"
          echo "$APP_PATH"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build/Payload"

          mkdir -p "$GITHUB_WORKSPACE/build/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/build/Payload/"

          cd "$GITHUB_WORKSPACE/build"

          zip -qry "3105.ipa" "Payload"

          if [ ! -f "3105.ipa" ]; then
            echo "ERROR: No se creó el IPA."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "IPA CREADO CORRECTAMENTE"
          echo "=========================================="

          ls -lh "3105.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: build/3105.ipa
          if-no-files-found: error

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-files
          path: |
            build/
            /tmp/patches.txt
          if-no-files-found: warn
