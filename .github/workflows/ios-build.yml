name: Build 3105 IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 3105 IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -e

          unzip -o "3105-with-github-actions.zip" -d .

          echo "Proyecto:"
          ls -la "3105-main"

          test -f "3105-main/ThreeOneOSFive.xcodeproj/project.pbxproj"

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Show project targets
        working-directory: 3105-main
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -list

      - name: Build iOS app
        working-directory: 3105-main
        run: |
          set -e

          rm -rf build

          mkdir -p build

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find built app
        working-directory: 3105-main
        run: |
          set -e

          echo "Contenido de build:"
          find build -maxdepth 3 -print

          APP_PATH=$(find build \
            -type d \
            -name "3105.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Xcode no generó 3105.app"
            exit 1
          fi

          echo "APP encontrada:"
          echo "$APP_PATH"

          echo "APP_PATH=$PWD/$APP_PATH" >> "$GITHUB_ENV"

      - name: Create IPA
        working-directory: 3105-main
        run: |
          set -e

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/3105.app

          zip -qry 3105.ipa Payload

          echo "================================"
          echo "IPA GENERADA"
          echo "================================"

          ls -lh 3105.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105-main/3105.ipa
          if-no-files-found: error
