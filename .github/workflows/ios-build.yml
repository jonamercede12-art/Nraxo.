name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Xcode project
        shell: bash
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE" \
            -name "ThreeOneOSFive.xcodeproj" \
            -type d \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ThreeOneOSFive.xcodeproj"
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT"

          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Fix missing SeedPatches filenames
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          PATCH_DIR="$PROJECT_DIR/ThreeOneOSFive/SeedPatches"

          echo "SeedPatches:"
          ls -la "$PATCH_DIR"

          # El proyecto busca PECHO FFTH, pero el archivo real se llama CHEST FFTH
          if [ -f "$PATCH_DIR/AIMBOT CHEST FFTH.3105" ] && \
             [ ! -f "$PATCH_DIR/AIMBOT PECHO FFTH.3105" ]; then
            cp "$PATCH_DIR/AIMBOT CHEST FFTH.3105" \
               "$PATCH_DIR/AIMBOT PECHO FFTH.3105"
          fi

          # El proyecto tiene CHETS (error de escritura), pero el archivo real es CHEST
          if [ -f "$PATCH_DIR/AIMBOT CHEST FFTH.3105" ] && \
             [ ! -f "$PATCH_DIR/AIMBOT CHETS FFTH.3105" ]; then
            cp "$PATCH_DIR/AIMBOT CHEST FFTH.3105" \
               "$PATCH_DIR/AIMBOT CHETS FFTH.3105"
          fi

          # El proyecto tiene dos espacios en CHEST  FFMX
          if [ -f "$PATCH_DIR/AIMBOT CHEST FFMX.3105" ] && \
             [ ! -f "$PATCH_DIR/AIMBOT CHEST  FFMX.3105" ]; then
            cp "$PATCH_DIR/AIMBOT CHEST FFMX.3105" \
               "$PATCH_DIR/AIMBOT CHEST  FFMX.3105"
          fi

          echo "Archivos después de la corrección:"
          ls -la "$PATCH_DIR"

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Check project
        run: |
          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

      - name: Build 3105
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/DerivedData"
          rm -rf "$RUNNER_TEMP/3105-build"

          mkdir -p "$RUNNER_TEMP/3105-build"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "3105" \
            -configuration "Release" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/3105-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find app
        shell: bash
        run: |
          set -e

          APP=$(find "$RUNNER_TEMP/3105-build" \
            -maxdepth 2 \
            -name "*.app" \
            -type d \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró el archivo .app"
            find "$RUNNER_TEMP/3105-build" -maxdepth 3 -print
            exit 1
          fi

          echo "APP encontrado:"
          echo "$APP"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/3105.app"

          cd "$RUNNER_TEMP"

          zip -r -q "3105.ipa" Payload

          echo "================================="
          echo "IPA CREADO CORRECTAMENTE"
          echo "================================="

          ls -lh "$RUNNER_TEMP/3105.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: ${{ runner.temp }}/3105.ipa
          if-no-files-found: error
