name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect iOS project
        shell: bash
        run: |
          set -euxo pipefail

          echo "Directorio actual:"
          pwd

          echo "Contenido:"
          ls -la

          echo ""
          echo "Buscando proyectos iOS..."

          find . \
            -type f \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" \) \
            -not -path "*/Pods/*" \
            -not -path "*/DerivedData/*" \
            -print

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail

          sudo xcode-select -s /Applications/Xcode.app

          echo "Xcode:"
          xcodebuild -version

      - name: Find Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT=$(find . -type f -name "*.xcodeproj" \
            -not -path "*/Pods/*" \
            -not -path "*/DerivedData/*" \
            | head -n 1)

          WORKSPACE=$(find . -type f -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -not -path "*/DerivedData/*" \
            | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
            echo "Encontrado workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
            echo "Encontrado proyecto: $PROJECT"
          else
            echo "ERROR: No se encontró ningún .xcodeproj ni .xcworkspace."
            echo ""
            echo "Estructura del proyecto:"
            find . -maxdepth 4 -print
            exit 1
          fi

      - name: Show schemes
        shell: bash
        run: |
          set -euxo pipefail

          if [ -n "${WORKSPACE:-}" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -list
          else
            xcodebuild \
              -project "$PROJECT" \
              -list
          fi
