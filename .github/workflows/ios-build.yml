name: Build Nraxo IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      - name: Fix missing patch reference
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("ThreeOneOSFive.xcodeproj/project.pbxproj")
          s = p.read_text()

          s = s.replace(
              '84CD697CEF0BFC7524509317 /* AIMBOT PECHO FFTH.3105 in Resources */ = {isa = PBXBuildFile; fileRef = 0ABB3EA4093C0E23CFB36D8B; };\n',
              ''
          )

          s = s.replace(
              '\t\t0ABB3EA4093C0E23CFB36D8B /* AIMBOT PECHO FFTH.3105 */ = {isa = PBXFileReference; lastKnownFileType = file; path = "AIMBOT PECHO FFTH.3105"; sourceTree = "<group>"; };\n',
              ''
          )

          s = s.replace(
              '\t\t\t\t0ABB3EA4093C0E23CFB36D8B /* AIMBOT PECHO FFTH.3105 */,\n',
              ''
          )

          p.write_text(s)
          PY

      - name: Clean
        run: |
          xcodebuild clean \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release

      - name: Build archive
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -archivePath "$PWD/build/3105.xcarchive" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          mkdir -p build/Payload

          cp -R \
            build/3105.xcarchive/Products/Applications/3105.app \
            build/Payload/

          cd build
          zip -r Nraxo.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nraxo-IPA
          path: build/Nraxo.ipa
