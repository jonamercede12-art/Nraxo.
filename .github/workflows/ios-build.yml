name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project build
          mkdir -p project build

          ZIP_FILE="3105-with-github-actions.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró $ZIP_FILE"
            exit 1
          fi

          echo "Extrayendo proyecto..."
          unzip -q "$ZIP_FILE" -d project

          echo "Proyecto extraído correctamente."

      - name: Find Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH=$(find "$GITHUB_WORKSPACE/project" \
            -name "*.xcodeproj" \
            -type d \
            | head -n 1)

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No se encontró ningún .xcodeproj"
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_PATH")

          echo "PROJECT=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado:"
          echo "$PROJECT_PATH"

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando archivos .patch y .diff..."

          PATCH_LIST="/tmp/patches.txt"
          : > "$PATCH_LIST"

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.patch" -o -name "*.diff" \) \
            -print > "$PATCH_LIST" || true

          if [ ! -s "$PATCH_LIST" ]; then
            echo "No se encontraron patches."
          else
            echo "Patches encontrados:"
            cat "$PATCH_LIST"

            while IFS= read -r PATCH; do
              [ -z "$PATCH" ] && continue

              echo ""
              echo "========================================"
              echo "Aplicando:"
              echo "$PATCH"
              echo "========================================"

              cd "$PROJECT_DIR"

              if git apply --check "$PATCH" >/dev/null 2>&1; then
                echo "Aplicando con git apply..."
                git apply "$PATCH"
              elif patch --dry-run -p1 < "$PATCH" >/dev/null 2>&1; then
                echo "Aplicando con patch -p1..."
                patch -p1 < "$PATCH"
              else
                echo "ADVERTENCIA: No se pudo aplicar automáticamente:"
                echo "$PATCH"
                echo "Continuando con la compilación."
              fi

            done < "$PATCH_LIST"
          fi

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "Xcode seleccionado:"
          xcodebuild -version

      - name: Detect workspace or project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE_PATH=$(find "$PROJECT_DIR" \
            -maxdepth 2 \
            -name "*.xcworkspace" \
            -type d \
            | head -n 1 || true)

          if [ -n "$WORKSPACE_PATH" ]; then
            echo "BUILD_CONTAINER=-workspace" >> "$GITHUB_ENV"
            echo "BUILD_PATH=$WORKSPACE_PATH" >> "$GITHUB_ENV"

            echo "Workspace encontrado:"
            echo "$WORKSPACE_PATH"
          else
            echo "BUILD_CONTAINER=-project" >> "$GITHUB_ENV"
            echo "BUILD_PATH=$PROJECT" >> "$GITHUB_ENV"

            echo "Usando Xcode project:"
            echo "$PROJECT"
          fi

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          echo "Verificando proyecto..."

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -list

      - name: Set scheme
        shell: bash
        run: |
          set -euo pipefail

          # El proyecto tiene un único scheme confirmado: 3105
          SCHEME="3105"

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Scheme seleccionado: $SCHEME"

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build/DerivedData"

          mkdir -p "$GITHUB_WORKSPACE/build/DerivedData"

          echo "Limpiando proyecto..."

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          echo "Compilando aplicación..."

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find generated app
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando aplicación compilada..."

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name "*.app" \
            -path "*/Build/Products/Release-iphoneos/*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró el .app."

            echo ""
            echo "Contenido de DerivedData:"
            find "$GITHUB_WORKSPACE/build/DerivedData" \
              -maxdepth 8 \
              -print \
              | head -300

            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "APP ENCONTRADA"
          echo "========================================"
          echo "$APP_PATH"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build/Payload"

          mkdir -p "$GITHUB_WORKSPACE/build/Payload"

          echo "Copiando .app..."

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/build/Payload/"

          cd "$GITHUB_WORKSPACE/build"

          echo "Creando IPA..."

          zip -qry \
            "3105.ipa" \
            "Payload"

          if [ ! -f "$GITHUB_WORKSPACE/build/3105.ipa" ]; then
            echo "ERROR: No se pudo crear 3105.ipa"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "IPA CREADO CORRECTAMENTE"
          echo "========================================"

          ls -lh "$GITHUB_WORKSPACE/build/3105.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: build/3105.ipa
          if-no-files-found: error

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-files
          path: |
            build/
            /tmp/patches.txt
          if-no-files-found: warn
