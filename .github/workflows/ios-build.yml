name: Build 3105 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2.0"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Verify project
        run: |
          set -euo pipefail

          test -f "ThreeOneOSFive.xcodeproj/project.pbxproj"
          test -d "ThreeOneOSFive/SeedPatches"

          echo "Proyecto encontrado correctamente."

      - name: Verify required AIMBOT patches
        run: |
          set -euo pipefail

          SEED="ThreeOneOSFive/SeedPatches"

          test -f "$SEED/AIMBOT BODY FFTH.3105"
          test -f "$SEED/AIMBOT CHEST FFTH.3105"
          test -f "$SEED/AIMBOT BODY FFMX.3105"
          test -f "$SEED/AIMBOT CHEST FFMX.3105"

          echo "Todos los patches AIMBOT existen."

      - name: Verify BODY and CHEST use the same patch
        run: |
          set -euo pipefail

          SEED="ThreeOneOSFive/SeedPatches"

          FFTH_BODY=$(shasum -a 256 "$SEED/AIMBOT BODY FFTH.3105" | awk '{print $1}')
          FFTH_CHEST=$(shasum -a 256 "$SEED/AIMBOT CHEST FFTH.3105" | awk '{print $1}')

          FFMX_BODY=$(shasum -a 256 "$SEED/AIMBOT BODY FFMX.3105" | awk '{print $1}')
          FFMX_CHEST=$(shasum -a 256 "$SEED/AIMBOT CHEST FFMX.3105" | awk '{print $1}')

          if [ "$FFTH_BODY" != "$FFTH_CHEST" ]; then
            echo "ERROR: FFTH BODY y CHEST no usan el mismo patch."
            exit 1
          fi

          if [ "$FFMX_BODY" != "$FFMX_CHEST" ]; then
            echo "ERROR: FFMX BODY y CHEST no usan el mismo patch."
            exit 1
          fi

          echo "OK: FFTH BODY == FFTH CHEST"
          echo "OK: FFMX BODY == FFMX CHEST"

      - name: Fix patch name typo
        run: |
          set -euo pipefail

          PROJECT="ThreeOneOSFive.xcodeproj/project.pbxproj"

          sed -i '' 's/AIMBOT CHETS FFTH/AIMBOT CHEST FFTH/g' "$PROJECT"

          echo "Nombres de patches corregidos."

      - name: List AIMBOT patches
        run: |
          echo "=== AIMBOT PATCHES ==="
          ls -lh "ThreeOneOSFive/SeedPatches/"*AIMBOT*3105

      - name: Build
        run: |
          set -euo pipefail

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
