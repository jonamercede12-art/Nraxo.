name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project build
          mkdir -p project build

          ZIP_FILE="3105-with-github-actions.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró $ZIP_FILE"
            exit 1
          fi

          echo "Extrayendo proyecto..."
          unzip -q "$ZIP_FILE" -d project

          echo "Contenido extraído:"
          find project -maxdepth 4 -type f | head -200

      - name: Find Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="$(find "$GITHUB_WORKSPACE/project" -name "*.xcodeproj" -type d | head -n 1)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No se encontró ningún archivo .xcodeproj"
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"

          echo "PROJECT=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado:"
          echo "$PROJECT_PATH"

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando patches..."

          PATCH_LIST="/tmp/patches.txt"
          : > "$PATCH_LIST"

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.patch" -o -name "*.diff" \) \
            -print > "$PATCH_LIST" || true

          if [ ! -s "$PATCH_LIST" ]; then
            echo "No se encontraron archivos .patch o .diff."
            exit 0
          fi

          echo "Patches encontrados:"
          cat "$PATCH_LIST"

          while IFS= read -r PATCH; do
            [ -z "$PATCH" ] && continue

            echo ""
            echo "========================================"
            echo "Aplicando patch:"
            echo "$PATCH"
            echo "========================================"

            cd "$PROJECT_DIR"

            if git apply --check "$PATCH" >/dev/null 2>&1; then
              echo "Aplicando con git apply..."
              git apply "$PATCH"
              continue
            fi

            echo "git apply no pudo aplicar el patch."
            echo "Intentando con patch -p1..."

            if patch --dry-run -p1 < "$PATCH" >/dev/null 2>&1; then
              patch -p1 < "$PATCH"
              continue
            fi

            echo "ERROR: No se pudo aplicar:"
            echo "$PATCH"
            exit 1

          done < "$PATCH_LIST"

          echo "Todos los patches aplicables fueron procesados."

      - name: Remove Aimbot Pecho and Body options
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando referencias a 'Aimbot Pecho' y 'Body'..."

          SEARCH_ROOT="$PROJECT_DIR"

          if grep -RniE \
            --exclude-dir=".git" \
            --exclude="*.xcuserstate" \
            --exclude="project.pbxproj" \
            --exclude="*.plist" \
            "Aimbot Pecho|AimbotPecho|aimbot pecho|Body" \
            "$SEARCH_ROOT" > /tmp/aimbot_body_refs.txt 2>/dev/null; then

            echo "Se encontraron referencias:"
            cat /tmp/aimbot_body_refs.txt

            echo ""
            echo "IMPORTANTE:"
            echo "No se modificarán automáticamente archivos de código."
            echo "Las opciones deben eliminarse mediante los patches del proyecto."
          else
            echo "No se encontraron referencias directas."
          fi

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          xcodebuild -version
          swift --version

      - name: Detect workspace or project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE_PATH="$(find "$PROJECT_DIR" -maxdepth 2 -name "*.xcworkspace" -type d | head -n 1 || true)"

          if [ -n "$WORKSPACE_PATH" ]; then
            echo "BUILD_CONTAINER=-workspace" >> "$GITHUB_ENV"
            echo "BUILD_PATH=$WORKSPACE_PATH" >> "$GITHUB_ENV"
            echo "Usando workspace:"
            echo "$WORKSPACE_PATH"
          else
            echo "BUILD_CONTAINER=-project" >> "$GITHUB_ENV"
            echo "BUILD_PATH=$PROJECT" >> "$GITHUB_ENV"
            echo "Usando project:"
            echo "$PROJECT"
          fi

      - name: Detect scheme
        shell: bash
        run: |
          set -euo pipefail

          echo "Obteniendo schemes disponibles..."

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -list

          SCHEME="$(
            xcodebuild "$BUILD_CONTAINER" "$BUILD_PATH" -list 2>/dev/null |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "", $0)
                print
                exit
              }
            '
          )"

          if [ -z "$SCHEME" ]; then
            SCHEME="3105"
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Scheme seleccionado:"
          echo "$SCHEME"

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/DerivedData

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/DerivedData

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find generated app
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando .app generado..."

          APP_PATH="$(
            find "$GITHUB_WORKSPACE/build/DerivedData" \
              -type d \
              -name "*.app" \
              -path "*/Build/Products/Release-iphoneos/*" \
              | head -n 1
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró el .app generado."
            echo ""
            echo "Contenido de DerivedData:"
            find "$GITHUB_WORKSPACE/build/DerivedData" -maxdepth 8 -print | head -300
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "Aplicación encontrada:"
          echo "$APP_PATH"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/Payload
          mkdir -p build/Payload

          echo "Copiando aplicación..."

          cp -R "$APP_PATH" build/Payload/

          echo "Creando IPA..."

          cd build

          /usr/bin/zip \
            -qry \
            3105.ipa \
            Payload

          cd ..

          if [ ! -f "build/3105.ipa" ]; then
            echo "ERROR: No se pudo crear el IPA."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "IPA CREADO CORRECTAMENTE"
          echo "========================================"

          ls -lh build/3105.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: build/3105.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-files
          path: |
            build/
            /tmp/patches.txt
          if-no-files-found: warn
