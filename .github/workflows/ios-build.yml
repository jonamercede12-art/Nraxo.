name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project structure
        shell: bash
        run: |
          set -euxo pipefail
          echo "Directorio:"
          pwd
          echo "Contenido:"
          ls -la
          echo "Archivos principales:"
          find . -maxdepth 3 -type f | sort | head -300

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check package.json
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f package.json ]; then
            echo "ERROR: No se encontró package.json en la raíz del proyecto."
            echo "Buscando package.json:"
            find . -name package.json -not -path './node_modules/*' -print
            exit 1
          fi

          echo "package.json encontrado:"
          cat package.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f package-lock.json ]; then
            echo "Usando package-lock.json"
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            echo "Usando npm-shrinkwrap.json"
            npm ci
          elif [ -f yarn.lock ]; then
            echo "Usando yarn.lock"
            corepack enable
            yarn install --frozen-lockfile
          else
            echo "No existe lockfile. Usando npm install."
            npm install
          fi

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          echo "Scripts disponibles:"
          npm run

          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            echo "Ejecutando build..."
            npm run build
          else
            echo "ERROR: package.json no contiene un script 'build'."
            exit 1
          fi
