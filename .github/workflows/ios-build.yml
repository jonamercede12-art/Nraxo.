name: Build 3105 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Prepare files
        run: |
          chmod -R u+rwX,go+rX .
          find . -type f -name "*.3105" -exec chmod 644 {} \;

      - name: Build
        working-directory: 3105-main/ThreeOneOSFive
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/3105.app"

          test -d "$APP" || {
            echo "No se generó 3105.app"
            exit 1
          }

          mkdir Payload
          cp -R "$APP" Payload/3105.app
          zip -qry 3105.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105.ipa
