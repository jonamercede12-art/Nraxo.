name: Build 3105 IPA

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: macos-15

steps:
  - name: Descargar proyecto
    uses: actions/checkout@v4
  - name: Configurar Xcode
    uses: maxim-lobanov/setup-xcode@v1
    with:
      xcode-version: "16.4"
  - name: Preparar archivos
    run: |
      chmod -R u+rwX,go+rX .
      find . -type f -name "*.3105" -exec chmod 644 {} \;
  - name: Limpiar proyecto
    working-directory: 3105-main/ThreeOneOSFive
    run: |
      xcodebuild clean \
        -project ThreeOneOSFive.xcodeproj \
        -scheme 3105 \
        -configuration Release \
        -sdk iphoneos \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO
  - name: Compilar aplicación
    working-directory: 3105-main/ThreeOneOSFive
    run: |
      xcodebuild build \
        -project ThreeOneOSFive.xcodeproj \
        -scheme 3105 \
        -configuration Release \
        -sdk iphoneos \
        -derivedDataPath "$GITHUB_WORKSPACE/build" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        DEVELOPMENT_TEAM=""
  - name: Crear IPA
    run: |
      APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/3105.app"
      if [ ! -d "$APP" ]; then
        echo "ERROR: 3105.app no fue generado."
        find "$GITHUB_WORKSPACE/build" -name "*.app" -print
        exit 1
      fi
      rm -rf "$GITHUB_WORKSPACE/Payload"
      mkdir -p "$GITHUB_WORKSPACE/Payload"
      cp -R "$APP" "$GITHUB_WORKSPACE/Payload/3105.app"
      cd "$GITHUB_WORKSPACE"
      zip -qry 3105.ipa Payload
      if [ ! -f "$GITHUB_WORKSPACE/3105.ipa" ]; then
        echo "ERROR: No se pudo crear la IPA."
        exit 1
      fi
  - name: Subir IPA
    uses: actions/upload-artifact@v4
    with:
      name: 3105-IPA
      path: 3105.ipa
      if-no-files-found: error
