name: iOS Build

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: macos-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Prepare project
    shell: bash
    run: |
      set -e
      echo "Contenido inicial:"
      ls -la
      ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No se encontró ningún archivo .zip"
        exit 1
      fi
      echo "ZIP encontrado: $ZIP_FILE"
      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted
      echo "Buscando archivos Xcode..."
      PROJECT="$(find "$GITHUB_WORKSPACE/extracted" -type d -name '*.xcodeproj' -print -quit)"
      WORKSPACE="$(find "$GITHUB_WORKSPACE/extracted" -type d -name '*.xcworkspace' -print -quit)"
      if [ -n "$PROJECT" ]; then
        echo "Xcode project encontrado:"
        echo "$PROJECT"
        echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
      elif [ -n "$WORKSPACE" ]; then
        echo "Xcode workspace encontrado:"
        echo "$WORKSPACE"
        echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
      else
        echo "ERROR: Después de descomprimir el ZIP no se encontró ningún .xcodeproj ni .xcworkspace"
        echo ""
        echo "Archivos encontrados:"
        find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | head -200
        exit 1
      fi
  - name: Detect scheme
    shell: bash
    run: |
      set -e
      if [ -n "${PROJECT:-}" ]; then
        echo "Analizando proyecto:"
        xcodebuild -list -project "$PROJECT"
        SCHEME="$(xcodebuild -list -project "$PROJECT" 2>/dev/null \
          | awk '/Schemes:/ {found=1; next} found && NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')"
      else
        echo "Analizando workspace:"
        xcodebuild -list -workspace "$WORKSPACE"
        SCHEME="$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
          | awk '/Schemes:/ {found=1; next} found && NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')"
      fi
      if [ -z "$SCHEME" ]; then
        echo "ERROR: No se pudo detectar ningún Scheme de Xcode"
        exit 1
      fi
      echo "Scheme detectado: $SCHEME"
      echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
  - name: Build iOS
    shell: bash
    run: |
      set -e
      DERIVED_DATA="$GITHUB_WORKSPACE/build"
      if [ -n "${PROJECT:-}" ]; then
        xcodebuild \
          -project "$PROJECT" \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$DERIVED_DATA" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          build
      else
        xcodebuild \
          -workspace "$WORKSPACE" \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$DERIVED_DATA" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          build
      fi
  - name: Find app
    shell: bash
    run: |
      set -e
      APP_PATH="$(find build/Build/Products -type d -name '*.app' -print -quit)"
      if [ -z "$APP_PATH" ]; then
        echo "ERROR: No se encontró el .app después de compilar"
        exit 1
      fi
      echo "APP encontrada:"
      echo "$APP_PATH"
      mkdir -p artifact
      cp -R "$APP_PATH" artifact/
  - name: Upload app
    uses: actions/upload-artifact@v4
    with:
      name: iOS-App
      path: artifact/
