name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "Directorio:"
          pwd

          echo "Archivos del repositorio:"
          find . -maxdepth 3 -print | sort

      - name: Find Xcode project
        id: project
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE" \
            -name "*.xcodeproj" \
            -type d \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ningún .xcodeproj"
            echo ""
            echo "Contenido del repositorio:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -print
            exit 1
          fi

          echo "Proyecto encontrado:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          echo "Xcode instalado:"
          ls -d /Applications/Xcode*.app

          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)

          echo "Usando:"
          echo "$XCODE"

          sudo xcode-select -s "$XCODE"

          xcodebuild -version

      - name: List project
        run: |
          PROJECT="${{ steps.project.outputs.project }}"

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Build
        run: |
          PROJECT="${{ steps.project.outputs.project }}"

          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild \
            -project "$PROJECT" \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Payload"

          APP_PATH=$(find "$GITHUB_WORKSPACE/build/Build/Products" \
            -name "*.app" \
            -type d \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró el .app"
            find "$GITHUB_WORKSPACE/build" -print
            exit 1
          fi

          echo "App encontrada:"
          echo "$APP_PATH"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"

          zip -r Nraxo.ipa Payload

          echo "IPA creada:"
          ls -lh Nraxo.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nraxo-IPA
          path: Nraxo.ipa
          if-no-files-found: error
