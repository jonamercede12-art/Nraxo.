name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 3105 IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Repository:"
          pwd

          echo ""
          echo "Contenido:"
          ls -la

          echo ""
          echo "Contenido de 3105-main:"
          ls -la 3105-main

          echo ""
          echo "Comprobando Xcode project:"
          test -f "3105-main/ThreeOneOSFive.xcodeproj/project.pbxproj"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Show targets
        working-directory: 3105-main
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -list

      - name: Build iOS app
        working-directory: 3105-main
        run: |
          rm -rf build

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Locate application
        working-directory: 3105-main
        run: |
          echo "Buscando 3105.app..."

          find build \
            -type d \
            -name "3105.app" \
            -print

          APP_PATH=$(find build \
            -type d \
            -name "3105.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: 3105.app no fue generado."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create IPA
        working-directory: 3105-main
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/3105.app

          rm -f 3105.ipa

          /usr/bin/zip \
            -qry \
            3105.ipa \
            Payload

          echo ""
          echo "IPA generada:"
          ls -lh 3105.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105-main/3105.ipa
          if-no-files-found: error
