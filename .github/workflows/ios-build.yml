name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="3105-with-github-actions.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró $ZIP_FILE"
            exit 1
          fi

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          echo "Proyecto extraído correctamente."

      - name: Detect Xcode project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT=$(find project \
            -type d \
            -name "*.xcodeproj" \
            -not -path "*/Pods/*" \
            -not -path "*/DerivedData/*" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ningún .xcodeproj."
            find project -maxdepth 8 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado:"
          echo "$PROJECT"

      - name: Apply patches
        shell: bash
        run: |
          set -euxo pipefail

          cd "$PROJECT_DIR"

          echo "Buscando patches..."

          PATCH_FOUND=0

          find . \
            -type f \
            \( -name "*.patch" -o -name "*.diff" \) \
            -not -path "*/Pods/*" \
            -not -path "*/DerivedData/*" \
            -print | sort > /tmp/patches.txt

          while IFS= read -r PATCH; do
            [ -z "$PATCH" ] && continue

            PATCH_FOUND=1

            echo ""
            echo "========================================"
            echo "Aplicando patch:"
            echo "$PATCH"
            echo "========================================"

            if git apply --check "$PATCH"; then
              git apply "$PATCH"
              echo "Patch aplicado correctamente."
            elif patch --dry-run -p1 < "$PATCH"; then
              patch -p1 < "$PATCH"
              echo "Patch aplicado con -p1."
            else
              echo "ERROR: No se pudo aplicar el patch:"
              echo "$PATCH"
              exit 1
            fi

          done < /tmp/patches.txt

          if [ "$PATCH_FOUND" -eq 0 ]; then
            echo "No se encontraron archivos .patch o .diff."
            echo "Continuando..."
          else
            echo "Todos los patches encontrados fueron procesados."
          fi

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail

          sudo xcode-select -s /Applications/Xcode.app

          echo "Versión de Xcode:"
          xcodebuild -version

      - name: Detect workspace
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE=$(find "$PROJECT_DIR" \
            -type d \
            -name "*.xcworkspace" \
            -not -path "*/Pods/*" \
            -not -path "*/DerivedData/*" \
            -print -quit || true)

          if [ -n "$WORKSPACE" ]; then
            echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=workspace" >> "$GITHUB_ENV"

            echo "Workspace encontrado:"
            echo "$WORKSPACE"
          else
            echo "BUILD_TYPE=project" >> "$GITHUB_ENV"

            echo "Se utilizará:"
            echo "$PROJECT"
          fi

      - name: Detect scheme
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$BUILD_TYPE" = "workspace" ]; then
            LIST_OUTPUT=$(xcodebuild \
              -workspace "$WORKSPACE" \
              -list)
          else
            LIST_OUTPUT=$(xcodebuild \
              -project "$PROJECT" \
              -list)
          fi

          echo "$LIST_OUTPUT"

          SCHEME=$(echo "$LIST_OUTPUT" |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                print $1
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No se encontró ningún Scheme."
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Scheme seleccionado:"
          echo "$SCHEME"

      - name: Clean
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build

          if [ "$BUILD_TYPE" = "workspace" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              clean \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              clean \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Build iOS app
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          if [ "$BUILD_TYPE" = "workspace" ]; then

            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/build/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build

          else

            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/build/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build

          fi

      - name: Find app
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH=$(find build/DerivedData/Build/Products \
            -type d \
            -name "*.app" \
            -not -path "*/PlugIns/*" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró el archivo .app."
            find build/DerivedData/Build/Products -maxdepth 6 -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "App encontrada:"
          echo "$APP_PATH"

      - name: Create IPA
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          cd build

          rm -f 3105.ipa

          zip -qry 3105.ipa Payload

          if [ ! -f 3105.ipa ]; then
            echo "ERROR: No se pudo crear la IPA."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "IPA GENERADA"
          echo "========================================"

          ls -lh 3105.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: build/3105.ipa
          if-no-files-found: error
