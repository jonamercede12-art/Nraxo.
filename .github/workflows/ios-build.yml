name: Build 3105 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Find project
        run: |
          echo "Directorio actual:"
          pwd
          echo "Proyectos Xcode:"
          find . -name "ThreeOneOSFive.xcodeproj" -print

      - name: Prepare files
        run: |
          chmod -R u+rwX,go+rX .
          find . -type f -name "*.3105" -exec chmod 644 {} \;

      - name: Build
        run: |
          PROJECT=$(find . -name "ThreeOneOSFive.xcodeproj" -type d -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ThreeOneOSFive.xcodeproj"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Proyecto: $PROJECT"
          echo "Directorio: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/3105.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: No se generó 3105.app"
            find "$GITHUB_WORKSPACE/build" -name "*.app" -print
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/3105.app
          zip -qry 3105.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105.ipa
          if-no-files-found: error
