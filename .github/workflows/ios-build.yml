name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP."
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

      - name: Encontrar proyecto
        id: project
        shell: bash
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE/project" \
            -type d \
            -name "ThreeOneOSFive.xcodeproj" \
            -print \
            -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ThreeOneOSFive.xcodeproj."
            exit 1
          fi

          echo "Proyecto:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Detectar scheme
        id: scheme
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project }}"

          echo "=== Schemes disponibles ==="

          xcodebuild \
            -project "$PROJECT" \
            -list

          SCHEME=$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null \
            | sed -n '/Schemes:/,/^$/p' \
            | tail -n +2 \
            | sed 's/^[[:space:]]*//' \
            | sed '/^$/d' \
            | head -n 1)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No se encontró ningún scheme."
            exit 1
          fi

          echo "Scheme seleccionado: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Preparar archivos .3105
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project }}"
          PROJECT_DIR=$(dirname "$PROJECT")

          if [ -d "$PROJECT_DIR/SeedPatches" ]; then
            chmod -R u+rwX,go+rX "$PROJECT_DIR/SeedPatches"
          fi

          find "$PROJECT_DIR" \
            -type f \
            -name "*.3105" \
            -exec chmod 644 {} \;

      - name: Compilar aplicación
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"

          echo "Compilando:"
          echo "Proyecto: $PROJECT"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Encontrar aplicación
        id: app
        shell: bash
        run: |
          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -path "*/Build/Products/Release-iphoneos/*" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró el .app."
            exit 1
          fi

          echo "App encontrada:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Crear IPA
        shell: bash
        run: |
          APP_PATH="${{ steps.app.outputs.app_path }}"

          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"
          zip -r "3105.ipa" Payload

          ls -lh "3105.ipa"

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105.ipa
          if-no-files-found: error
