name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer ZIP
        run: |
          set -e

          unzip -q "3105-with-github-actions.zip" -d extracted

          echo "Contenido:"
          find extracted -maxdepth 3 -type d

      - name: Corregir App.swift
        run: |
          set -e

          APP_FILE="extracted/3105-main/ThreeOneOSFive/App.swift"

          python3 - "$APP_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          needle = "    var maskedKey: String {"

          positions = []
          pos = 0

          while True:
              found = text.find(needle, pos)

              if found == -1:
                  break

              positions.append(found)
              pos = found + len(needle)

          print("Declaraciones maskedKey encontradas:", len(positions))

          if len(positions) <= 1:
              print("No hay duplicado que eliminar.")
              raise SystemExit(0)

          # Segunda declaración
          start = positions[1]

          # Buscar la llave de apertura
          brace = text.find("{", start)

          if brace == -1:
              raise SystemExit("No se encontró la llave de maskedKey.")

          depth = 0
          i = brace

          while i < len(text):

              if text[i] == "{":
                  depth += 1

              elif text[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1

                      # Eliminar espacios y salto de línea posteriores
                      while end < len(text) and text[end] in " \t":
                          end += 1

                      if end < len(text) and text[end] == "\n":
                          end += 1

                      text = text[:start] + text[end:]

                      path.write_text(text, encoding="utf-8")

                      print("Duplicado maskedKey eliminado correctamente.")
                      print(
                          "Declaraciones restantes:",
                          text.count(needle)
                      )

                      raise SystemExit(0)

              i += 1

          raise SystemExit(
              "No se pudo encontrar el final de la segunda propiedad maskedKey."
          )

          PY

          echo ""
          echo "Verificación:"
          grep -n "var maskedKey: String" "$APP_FILE" || true

      - name: Compilar ThreeOneOSFive
        run: |
          set -e

          cd extracted/3105-main

          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crear IPA
        run: |
          set -e

          APP=$(find extracted/3105-main/build/Build/Products \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró el archivo .app"
            exit 1
          fi

          echo "APP encontrada:"
          echo "$APP"

          rm -rf Payload ThreeOneOSFive.ipa

          mkdir Payload

          cp -R "$APP" Payload/

          zip -qry ThreeOneOSFive.ipa Payload

          ls -lh ThreeOneOSFive.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: ThreeOneOSFive.ipa
