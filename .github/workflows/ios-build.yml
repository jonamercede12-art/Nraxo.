name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/source"

          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name "3105-with-github-actions.zip" -print -quit)

          if [ -n "$ZIP" ]; then
            echo "ZIP encontrado:"
            echo "$ZIP"

            unzip -q "$ZIP" -d "$RUNNER_TEMP/source"
          else
            echo "No se encontró el ZIP."
            echo "Buscando proyecto directamente..."

            cp -R "$GITHUB_WORKSPACE"/* "$RUNNER_TEMP/source/" 2>/dev/null || true
          fi

          echo "Contenido:"
          find "$RUNNER_TEMP/source" -maxdepth 3 -print

      - name: Encontrar Xcode project
        shell: bash
        run: |
          set -e

          PROJECT=$(find "$RUNNER_TEMP/source" \
            -type d \
            -name "ThreeOneOSFive.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ThreeOneOSFive.xcodeproj"
            find "$RUNNER_TEMP/source" -type d -name "*.xcodeproj" -print
            exit 1
          fi

          echo "================================="
          echo "PROYECTO ENCONTRADO:"
          echo "$PROJECT"
          echo "================================="

          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Mostrar versión de Xcode
        run: |
          xcodebuild -version

      - name: Verificar proyecto y Scheme
        run: |
          set -e

          xcodebuild \
            -project "$PROJECT_PATH" \
            -list

      - name: Preparar SeedPatches
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(dirname "$PROJECT_PATH")"
          PATCH_DIR="$PROJECT_DIR/ThreeOneOSFive/SeedPatches"

          if [ -d "$PATCH_DIR" ]; then
            echo "SeedPatches encontrado:"
            ls -la "$PATCH_DIR"

            # Correcciones de nombres si son necesarias
            if [ -f "$PATCH_DIR/AIMBOT CHEST FFTH.3105" ] && \
               [ ! -f "$PATCH_DIR/AIMBOT PECHO FFTH.3105" ]; then
              cp "$PATCH_DIR/AIMBOT CHEST FFTH.3105" \
                 "$PATCH_DIR/AIMBOT PECHO FFTH.3105"
            fi

            if [ -f "$PATCH_DIR/AIMBOT CHEST FFTH.3105" ] && \
               [ ! -f "$PATCH_DIR/AIMBOT CHETS FFTH.3105" ]; then
              cp "$PATCH_DIR/AIMBOT CHEST FFTH.3105" \
                 "$PATCH_DIR/AIMBOT CHETS FFTH.3105"
            fi

            if [ -f "$PATCH_DIR/AIMBOT CHEST FFMX.3105" ] && \
               [ ! -f "$PATCH_DIR/AIMBOT CHEST  FFMX.3105" ]; then
              cp "$PATCH_DIR/AIMBOT CHEST FFMX.3105" \
                 "$PATCH_DIR/AIMBOT CHEST  FFMX.3105"
            fi
          fi

      - name: Compilar 3105
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/DerivedData"
          rm -rf "$RUNNER_TEMP/3105-build"

          mkdir -p "$RUNNER_TEMP/3105-build"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "3105" \
            -configuration "Release" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/3105-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Buscar APP
        shell: bash
        run: |
          set -e

          APP=$(find "$RUNNER_TEMP/3105-build" \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró ningún .app"
            find "$RUNNER_TEMP/3105-build" -maxdepth 4 -print
            exit 1
          fi

          echo "APP encontrado:"
          echo "$APP"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Crear IPA
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/3105.app"

          cd "$RUNNER_TEMP"

          zip -r -q "3105.ipa" Payload

          echo "================================="
          echo "IPA CREADO"
          echo "================================="

          ls -lh "$RUNNER_TEMP/3105.ipa"

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: ${{ runner.temp }}/3105.ipa
          if-no-files-found: error
