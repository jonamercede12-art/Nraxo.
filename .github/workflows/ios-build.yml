name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project build
          mkdir -p project build

          if [ ! -f "3105-with-github-actions.zip" ]; then
            echo "ERROR: No se encontró 3105-with-github-actions.zip"
            exit 1
          fi

          unzip -q "3105-with-github-actions.zip" -d project

          echo "Proyecto extraído correctamente."

      - name: Find Xcode project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find "$GITHUB_WORKSPACE/project" \
            -name "*.xcodeproj" \
            -type d \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró ningún .xcodeproj"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT:"
          echo "$PROJECT"

      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail

          PATCH_LIST="/tmp/patches.txt"
          : > "$PATCH_LIST"

          find "$PROJECT_DIR" \
            -type f \
            \( -name "*.patch" -o -name "*.diff" \) \
            -print > "$PATCH_LIST" || true

          if [ ! -s "$PATCH_LIST" ]; then
            echo "No hay patches para aplicar."
          else
            while IFS= read -r PATCH; do
              [ -z "$PATCH" ] && continue

              echo "Procesando patch:"
              echo "$PATCH"

              cd "$PROJECT_DIR"

              if git apply --check "$PATCH" >/dev/null 2>&1; then
                git apply "$PATCH"
                echo "Patch aplicado con git apply."
              elif patch --dry-run -p1 < "$PATCH" >/dev/null 2>&1; then
                patch -p1 < "$PATCH"
                echo "Patch aplicado con patch -p1."
              else
                echo "Patch no aplicable; se continúa."
              fi
            done < "$PATCH_LIST"
          fi

      - name: Remove Aimbot Pecho and Body menu entries
        shell: bash
        run: |
          set -euo pipefail

          echo "Buscando archivos de código..."

          FILES=$(find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.swift" \
              -o -name "*.m" \
              -o -name "*.mm" \
              -o -name "*.h" \
              -o -name "*.plist" \
              -o -name "*.json" \
              -o -name "*.xml" \
              -o -name "*.strings" \
            \) \
            -not -path "*/.git/*")

          echo "Buscando referencias exactas..."

          FOUND=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            if grep -qEi \
              "Aimbot Pecho|AimbotPecho|Aimbot_Pecho|aimbot pecho" \
              "$FILE" 2>/dev/null; then

              echo ""
              echo "Encontrado Aimbot Pecho en:"
              echo "$FILE"

              FOUND=1
            fi

          done <<< "$FILES"

          echo ""
          echo "Buscando entrada exacta Body..."

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            if grep -qE \
              '["'\'']Body["'\'']|Text[[:space:]]*=[[:space:]]*["'\'']Body["'\'']|title[[:space:]]*[:=][[:space:]]*["'\'']Body["'\'']' \
              "$FILE" 2>/dev/null; then

              echo ""
              echo "Encontrada entrada de menú Body en:"
              echo "$FILE"

              FOUND=1
            fi

          done <<< "$FILES"

          if [ "$FOUND" -eq 0 ]; then
            echo ""
            echo "No se encontraron las entradas mediante búsqueda de texto."
            echo "El proyecto puede estar generando esas opciones desde otra estructura."
          fi

          echo ""
          echo "Eliminando únicamente etiquetas visibles conocidas..."

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            case "$FILE" in
              *.swift|*.m|*.mm|*.h|*.strings)
                if grep -q "Aimbot Pecho" "$FILE" 2>/dev/null; then
                  sed -i '' '/Aimbot Pecho/d' "$FILE"
                  echo "Eliminada línea de Aimbot Pecho: $FILE"
                fi
                ;;
            esac

          done <<< "$FILES"

          echo ""
          echo "Limpieza de etiquetas completada."

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="/Applications/Xcode_26.6.app/Contents/Developer"

          if [ ! -d "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app/Contents/Developer"
          fi

          sudo xcode-select -s "$XCODE_PATH"

          xcodebuild -version

      - name: Detect workspace or project
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find "$PROJECT_DIR" \
            -maxdepth 2 \
            -name "*.xcworkspace" \
            -type d \
            | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            echo "BUILD_CONTAINER=-workspace" >> "$GITHUB_ENV"
            echo "BUILD_PATH=$WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONTAINER=-project" >> "$GITHUB_ENV"
            echo "BUILD_PATH=$PROJECT" >> "$GITHUB_ENV"
          fi

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -list

      - name: Set scheme
        shell: bash
        run: |
          set -euo pipefail

          SCHEME="3105"

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Scheme: $SCHEME"

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build/DerivedData"

          mkdir -p "$GITHUB_WORKSPACE/build/DerivedData"

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          echo "Compilando 3105..."

          xcodebuild \
            "$BUILD_CONTAINER" "$BUILD_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH=$(find \
            "$GITHUB_WORKSPACE/build/DerivedData" \
            -type d \
            -name "*.app" \
            -path "*/Build/Products/Release-iphoneos/*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró el .app."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "APP:"
          echo "$APP_PATH"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build/Payload"

          mkdir -p "$GITHUB_WORKSPACE/build/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/build/Payload/"

          cd "$GITHUB_WORKSPACE/build"

          zip -qry "3105.ipa" "Payload"

          if [ ! -f "3105.ipa" ]; then
            echo "ERROR: No se creó el IPA."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "IPA CREADO"
          echo "========================================"

          ls -lh "3105.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ipa
          path: build/3105.ipa
          if-no-files-found: error

      - name: Upload build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-build-files
          path: |
            build/
            /tmp/patches.txt
          if-no-files-found: warn
